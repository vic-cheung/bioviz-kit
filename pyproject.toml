[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "bioviz-kit"
version = "0.4.2"
description = "Framework-agnostic plotting utilities for biological and clinical data visualization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "Victoria Cheung", email = "victoriakcheung@gmail.com" } ]
requires-python = ">=3.11"

dependencies = [
	"pandas>=2.0",
	"matplotlib>=3.6",
	"pydantic>=2,<3",
	"numpy>=1.24",
	"scipy>=1.10",
]

classifiers = [
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/vic-cheung/bioviz-kit"
"Issue Tracker" = "https://github.com/vic-cheung/bioviz-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
testing = ["pytest"]
volcano = ["adjusttext>=0.8"]
line = ["adjusttext>=0.8", "seaborn>=0.12"]
km = ["lifelines>=0.29"]
grouped = ["seaborn>=0.12", "statsmodels>=0.14.6"]
grouped-bar = ["statsmodels>=0.14.6"]
all = [
	"adjusttext>=0.8",
	"lifelines>=0.29",
	"seaborn>=0.12",
	"statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
	"ruff>=0.6",
	"pytest>=8.0",
	"build>=1.0",
	"twine>=4.0",
	"certifi>=2025.0",
	"ipykernel>=7.1.0",
	"adjusttext>=0.8",
	"lifelines>=0.29",
	"seaborn>=0.12",
	"statsmodels>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "SIM108", # ternary operator suggestion
]

[tool.ruff.lint.isort]
known-first-party = ["bioviz"]
